name: CI / Security, Compliance & Build Verification

permissions:
  contents: read

on:
  push:
    branches: [ main, backend_database_supabase ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Security Gate, 2500 Compliance Checks & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Deterministic dependency install (ignore install scripts)
        run: npm ci --ignore-scripts

      - name: Supply chain vulnerability audit
        run: npm audit --audit-level=high

      - name: TypeScript strict type verification
        run: npm run typecheck

      - name: Run automated security, negative & 2,500 compliance test suite
        run: npm test

      - name: Build Next.js production bundle
        run: npm run build
